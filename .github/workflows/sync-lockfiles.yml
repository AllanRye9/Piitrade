name: Sync Lockfiles

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  sync-root:
    name: Root – Sync package-lock.json
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for package.json / package-lock.json mismatch
        id: check
        run: |
          set -uo pipefail
          if [ -f package-lock.json ]; then
            LOCK_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          else
            LOCK_HASH=""
            echo "No root package-lock.json found – will generate one."
          fi
          npm install --package-lock-only --ignore-scripts --loglevel=error
          NEW_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [ "$LOCK_HASH" != "$NEW_HASH" ]; then
            echo "mismatch=true" >> "$GITHUB_OUTPUT"
            echo "Mismatch detected in root package-lock.json – will reinstall."
          else
            echo "mismatch=false" >> "$GITHUB_OUTPUT"
            echo "Root package-lock.json is in sync."
          fi
          # Restore the original lockfile before the actual fix step, but only
          # if it's actually tracked by git – `git restore` errors out with a
          # "pathspec ... did not match any files" if the lockfile was never
          # committed, which previously failed this whole step.
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git restore package-lock.json
          else
            rm -f package-lock.json
          fi

      - name: Fix – reinstall and build
        if: steps.check.outputs.mismatch == 'true'
        run: |
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts
          echo "Root dependencies reinstalled successfully."

      - name: Commit updated package-lock.json
        if: steps.check.outputs.mismatch == 'true'
        run: |
          git config user.name "Allan Rye"
          git config user.email "allan.rye.9999@gmail.com"
          git add package-lock.json
          git commit -m "chore(root): sync package-lock.json with package.json [skip ci]"
          git push

  sync-frontend:
    name: Frontend – Sync package-lock.json
    runs-on: ubuntu-latest
    needs: sync-root
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for package.json / package-lock.json mismatch
        id: check
        run: |
          set -uo pipefail
          if [ -f package-lock.json ]; then
            LOCK_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          else
            LOCK_HASH=""
            echo "No frontend package-lock.json found – will generate one."
          fi
          npm install --package-lock-only --ignore-scripts --loglevel=error
          NEW_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [ "$LOCK_HASH" != "$NEW_HASH" ]; then
            echo "mismatch=true" >> "$GITHUB_OUTPUT"
            echo "Mismatch detected in frontend package-lock.json – will reinstall."
          else
            echo "mismatch=false" >> "$GITHUB_OUTPUT"
            echo "Frontend package-lock.json is in sync."
          fi
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git restore package-lock.json
          else
            rm -f package-lock.json
          fi

      - name: Fix – reinstall and build
        if: steps.check.outputs.mismatch == 'true'
        run: |
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

      - name: Commit updated package-lock.json
        if: steps.check.outputs.mismatch == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "Allan Rye"
          git config user.email "allan.rye.9999@gmail.com"
          git add frontend/package-lock.json
          git commit -m "chore(frontend): sync package-lock.json with package.json [skip ci]"
          git push

  sync-backend:
    name: Backend – Sync package-lock.json
    runs-on: ubuntu-latest
    needs: sync-frontend
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for package.json / package-lock.json mismatch
        id: check
        run: |
          set -uo pipefail
          if [ -f package-lock.json ]; then
            LOCK_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          else
            LOCK_HASH=""
            echo "No backend package-lock.json found – will generate one."
          fi
          npm install --package-lock-only --ignore-scripts --loglevel=error
          NEW_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [ "$LOCK_HASH" != "$NEW_HASH" ]; then
            echo "mismatch=true" >> "$GITHUB_OUTPUT"
            echo "Mismatch detected in backend package-lock.json – will reinstall."
          else
            echo "mismatch=false" >> "$GITHUB_OUTPUT"
            echo "Backend package-lock.json is in sync."
          fi
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git restore package-lock.json
          else
            rm -f package-lock.json
          fi

      - name: Fix – reinstall and build
        if: steps.check.outputs.mismatch == 'true'
        run: |
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts
          npm run db:setup
          npm run db:setup:hotfixes
          npx prisma generate
          npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/marketplace_db?schema=public

      - name: Commit updated package-lock.json
        if: steps.check.outputs.mismatch == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "Allan Rye"
          git config user.email "allan.rye.9999@gmail.com"
          git add backend/package-lock.json
          git commit -m "chore(backend): sync package-lock.json with package.json [skip ci]"
          git push