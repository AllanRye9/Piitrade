name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend – Type Check & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run database setup
        run: npm run db:setup
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/marketplace_db?schema=public

      - name: Validate hotfix processing path
        run: npm run db:setup:hotfixes
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/marketplace_db?schema=public

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/marketplace_db?schema=public

      - name: TypeScript type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Real-PostgreSQL tests: subscription lifecycle, store activation (incl. rollback and
      # concurrency), category counts, admin alerts, inbox pagination. The CI database is
      # throwaway — these tests TRUNCATE every table.
      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/marketplace_db?schema=public

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/marketplace_db?schema=public

  frontend:
    name: Frontend – Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm exec tsc -- --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
