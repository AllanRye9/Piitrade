# docker-compose.yml
#
# Full local stack — Postgres + backend + frontend — built from the exact
# same Dockerfiles Railway uses in production. This is not a dev-mode
# compose (no bind-mounts, no hot reload, no dev servers): it boots the real
# production images end-to-end, so a clean `docker compose up --build` here
# is the closest thing to a pre-flight check before deploying.
#
# Usage:
#   cp .env.example .env        # then fill in real secrets
#   docker compose up --build
#
#   (Every variable has a dev-safe default via ${VAR:-...}, so
#   `docker compose up --build` with no .env at all also works for a quick
#   smoke test — just don't reuse those defaults anywhere real.)
#
#   Frontend:   http://localhost:3000
#   Backend:    http://localhost:5000/health
#   PostgreSQL: localhost:55432 (mapped off 5432 to avoid clashing with a
#               Postgres you may already have running locally)
#
# Tear down (including volumes, for a truly clean slate):
#   docker compose down -v
#
# NOTE on NEXT_PUBLIC_API_URL: this value is baked into the frontend's
# client-side JS bundle at BUILD time and is what the *browser* uses to
# reach the API, so it must be the host-published URL (http://localhost:5000)
# — not the internal Docker service name (http://backend:5000), which the
# browser can't resolve. The frontend container's own server-side code
# (app/layout.tsx's background-image fetch) reuses this same variable and
# will therefore also try localhost:5000 *from inside its own container*,
# where nothing is listening on that port — that fetch is wrapped in a
# try/catch and degrades gracefully (no background image, nothing else
# breaks), exactly as it does on a real deploy target that also can't reach
# the API at that exact URL. This mirrors production behavior faithfully;
# it is not a bug in this compose file.

services:
  postgres:
    image: postgres:16-alpine
    container_name: lapit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_secret}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_db}
    ports:
      - "55432:5432"
    volumes:
      - lapit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace} -d ${POSTGRES_DB:-marketplace_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - lapit_net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lapit_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:-marketplace_secret}@postgres:5432/${POSTGRES_DB:-marketplace_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-test-jwt-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-test-jwt-refresh-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # Frontend is reached by the browser at localhost:3000, so that's the
      # origin the API needs to allow — not the internal service name.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5000}
      # Browser-facing frontend origin — used to build links in transactional
      # emails (verification, password reset, etc.).
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AUTO_MIGRATE_ON_START: ${AUTO_MIGRATE_ON_START:-true}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-to-a-strong-password}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-this-to-a-strong-admin-registration-secret}
      # Security switches (see SECURITY_AUDIT.md). All default to OFF/unset:
      #  - the backend refuses to start in production with placeholder/short secrets
      #  - /api/auth/admin-register is disabled in production unless explicitly enabled
      #  - /api/cv-payment/confirm needs this shared secret once a gateway calls it
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-}
      ENABLE_ADMIN_REGISTER: ${ENABLE_ADMIN_REGISTER:-}
      CV_PAYMENT_WEBHOOK_SECRET: ${CV_PAYMENT_WEBHOOK_SECRET:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      # Optional S3-compatible storage; leave unset to fall back to local
      # disk uploads served from the `lapit_uploads` volume below.
      ACCESS_KEY_ID: ${ACCESS_KEY_ID:-}
      SECRET_ACCESS_KEY: ${SECRET_ACCESS_KEY:-}
      BUCKET: ${BUCKET:-}
      ENDPOINT: ${ENDPOINT:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "5000:5000"
    volumes:
      - lapit_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lapit_net
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Must be reachable from the browser, not just from inside this
        # container — see the note at the top of this file.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        # Baked in at build time like NEXT_PUBLIC_API_URL above — used
        # server-side for metadata/sitemap/robots/OG URLs where there's no
        # browser window.location to fall back on.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: lapit_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lapit_net
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  lapit_net:
    driver: bridge

volumes:
  lapit_pgdata:
  lapit_uploads:
