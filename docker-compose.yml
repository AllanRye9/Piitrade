services:
  # Local Postgres for development only. Not used in production — Railway
  # provides its own managed Postgres via DATABASE_URL/DATABASE_PRIVATE_URL.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_secret
      POSTGRES_DB: marketplace_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace_db']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations then seeds dummy categories/subcategories
  # (see backend/prisma/seed.ts) so a fresh `docker compose up` gives you a
  # working local dataset to test against instead of an empty DB. Exits
  # after seeding; it does not stay running.
  db-setup:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
      args:
        DATABASE_URL: postgresql://marketplace:marketplace_secret@postgres:5432/marketplace_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace_secret@postgres:5432/marketplace_db?schema=public
      NODE_ENV: development
    entrypoint: ['sh', '-c']
    command:
      - |
        npx prisma migrate deploy &&
        npm run prisma:seed &&
        echo "Local dummy data seeded."
    restart: 'no'

volumes:
  postgres_data:
